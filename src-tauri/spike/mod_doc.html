<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Spike PDF Title</title>
<style>
  @font-face { font-family: "Spike Sans"; src: url(data:font/ttf;base64,__FONT__) format("truetype"); }
  @page { size: 210mm 297mm; margin: 0; }
  html, body { margin: 0; padding: 0; }
  body { font-family: "Spike Sans", sans-serif; font-size: 14pt; }
  .page { position: relative; width: 210mm; height: 296mm; overflow: hidden; break-after: page; page-break-after: always; background: #fff; }
  .page:last-child { break-after: auto; page-break-after: auto; }
  .edge { position: absolute; left: 0; top: 0; width: 20mm; height: 20mm; background: #000; }
  .edge.br { left: auto; top: auto; right: 0; bottom: 0; }
  .text { position: absolute; left: 30mm; top: 40mm; width: 150mm; }
</style>
</head>
<body>
<section class="page"><div class="edge"></div><div class="edge br"></div>
  <div class="text"><h1>Page 1</h1><p>Plain, <b>bold</b>, <i>italic</i> and <u>underlined</u> text. Äöüß €</p></div></section>
<section class="page"><div class="edge"></div><div class="edge br"></div>
  <div class="text"><h1>Page 2</h1><p>Second page, selectable text.</p></div></section>
</body>
</html>
